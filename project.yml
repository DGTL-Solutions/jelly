name: Jelly
options:
  bundleIdPrefix: de.jelly
  developmentLanguage: de
  deploymentTarget:
    tvOS: '18.0'
packages:
  # Player engine: LGPL-3.0 with an App Store exception, FFmpeg as LGPL dynamic frameworks (no GPL parts).
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 7.46.0
  # libass for authored ASS/SSA subtitles (ISC, with FreeType, HarfBuzz, FriBidi, libunibreak).
  libass:
    url: https://github.com/mpvkit/libass-build
    exactVersion: 0.17.5
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    JELLY_BUNDLE_ID: de.jelly.tv
    CURRENT_PROJECT_VERSION: '1'
    # LibDovi (Dolby Vision in AetherEngine) ships no Intel simulator slice; this Mac is Apple silicon.
    EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
    # German is the source language of the string catalogs; English translations live next to it.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Jelly:
    type: application
    platform: tvOS
    sources: [Jelly]
    dependencies:
      - package: AetherEngine
      - package: libass
      - target: JellyTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JELLY_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Jelly/Jelly.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jelly
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Jelly verbindet sich mit deinem Jellyfin-Server im Heimnetz.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Jelly/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIUserInterfaceStyle: Dark
        # HTTPS only through Apple's URLSession, SHA-256 only for cache names: no non-exempt encryption.
        ITSAppUsesNonExemptEncryption: false
        # German and English; any other device language gets English.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en]
        CFBundleURLTypes:
          - CFBundleURLName: de.jelly.tv
            CFBundleURLSchemes: [jelly]
  JellyTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - JellyTopShelf
      - Jelly/Core/Models.swift
      - Jelly/Core/JellyfinClient.swift
      - Jelly/Core/PlaybackSupport.swift
      - Jelly/Core/SecureStore.swift
      - Jelly/Core/Artwork.swift
      - Jelly/Core/Diagnostics.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JELLY_BUNDLE_ID).topshelf
        CODE_SIGN_ENTITLEMENTS: JellyTopShelf/JellyTopShelf.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jelly
    info:
      path: JellyTopShelf/Info.plist
      properties:
        # Like the app: Jellyfin servers at home often answer on plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
  JellyTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [JellyTests]
    dependencies:
      - target: Jelly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Jelly:
    build:
      targets:
        Jelly: all
        JellyTests: [test]
    test:
      targets: [JellyTests]
